name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1-5" # weekdays, 06:00 UTC

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run mypy tests
      - run: uv run pytest -q

  # Runs the 40-case golden set against the real API and fails if accuracy drops below
  # evals/baseline.json, if any case has a safety failure, or if the token ceiling cuts
  # the run short. Spends money, so it runs nightly, on demand, and on PRs that touch the
  # agent, the data or the evals; it is skipped when the API key secret is not available
  # (forks, or before the secret is configured).
  eval-regression:
    runs-on: ubuntu-latest
    needs: lint-type-test
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request'
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RECON_MODEL: ${{ vars.RECON_MODEL || 'claude-opus-5-5' }}
      RECON_EFFORT: ${{ vars.RECON_EFFORT || 'medium' }}
      RECON_EVAL_TOKEN_CEILING: ${{ vars.RECON_EVAL_TOKEN_CEILING }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide whether to run
        id: gate
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY secret not available; skipping the eval."
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            if ! git diff --name-only "$base" HEAD | grep -qE '^(src/|evals/|datagen/|ledger_mcp_stub/|pricing.toml)'; then
              echo "::notice::PR does not touch the agent, data or evals; skipping."
              echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v6
        if: steps.gate.outputs.run == 'true'
      - if: steps.gate.outputs.run == 'true'
        run: uv python install 3.12 && uv sync --locked
      - name: Run golden set and check against baseline
        if: steps.gate.outputs.run == 'true'
        run: uv run recon-copilot eval --check
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.run == 'true'
        with:
          name: eval-report
          path: evals/reports/
