[project]
name = "recon-copilot"
version = "0.1.0"
description = "Agent that helps a finance team triage bank reconciliation exceptions"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.8,<3",
    "mcp>=2.3,<3",
    "pydantic>=2.9,<3",
]

[project.scripts]
recon-copilot = "recon_copilot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recon_copilot", "ledger_mcp_stub", "datagen", "evals"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["recon_copilot", "ledger_mcp_stub", "datagen", "evals"]
mypy_path = "src:."

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
